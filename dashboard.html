<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Usage</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070a12;
    --panel: #0b101b;
    --panel-2: #0f1524;
    --line: #1a2335;
    --line-2: #26314a;
    --ink: #e8ecf4;
    --ink-2: #aab4c8;
    --mute: #7c88a3;
    --c-fable: #3987e5;
    --c-opus: #d95926;
    --c-sonnet: #199e70;
    --c-haiku: #c98500;
    --c-other: #d55181;
    --c-local: #9085e9;
    --good: #0ca30c;
    --warn: #fab219;
    --crit: #d03b3b;
    --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 12px/1.45 var(--mono); padding: 14px 16px 28px; min-width: 320px; }
  .lbl { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
  .num { font-variant-numeric: tabular-nums; }
  .dim { color: var(--mute); }
  .ink2 { color: var(--ink-2); }

  /* header */
  header { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: stretch;
    border: 1px solid var(--line); background: var(--panel); padding: 10px 14px; }
  .brand { display: flex; flex-direction: column; justify-content: center; padding-right: 18px;
    border-right: 1px solid var(--line); }
  .brand b { font-size: 15px; letter-spacing: .14em; }
  .kpis { display: flex; flex-wrap: wrap; gap: 8px 28px; flex: 1; }
  .kpi { display: flex; flex-direction: column; justify-content: center; min-width: 96px; }
  .kpi .v { font-size: 21px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .kpi .s { font-size: 10px; color: var(--mute); white-space: nowrap; }
  .hdr-right { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: .1em; color: var(--ink-2); }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .pulse.off { background: var(--crit); }
  @media (prefers-reduced-motion: no-preference) {
    .pulse:not(.off), .dot.live { animation: pulse 1.8s ease-in-out infinite; }
    .flow { animation: flow 1.2s linear infinite; }
  }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes flow { to { stroke-dashoffset: -18; } }
  .seg { display: inline-flex; border: 1px solid var(--line-2); }
  .seg button, .btn { font: inherit; font-size: 10px; letter-spacing: .1em; color: var(--ink-2);
    background: transparent; border: 0; padding: 4px 9px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button[aria-pressed="true"] { background: var(--line-2); color: var(--ink); }
  .seg button:hover, .btn:hover { color: var(--ink); background: var(--panel-2); }
  .btn { border: 1px solid var(--line-2); }
  button:focus-visible { outline: 2px solid var(--c-fable); outline-offset: 1px; }
  .controls { display: flex; gap: 8px; align-items: center; }

  /* pace */
  .pace { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-top: 10px; padding: 7px 14px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); }
  .tag { font-size: 10px; letter-spacing: .12em; font-weight: 700; padding: 1px 6px; border: 1px solid currentColor; }
  .tag.ok { color: var(--good); } .tag.warn { color: var(--warn); } .tag.crit { color: var(--crit); }
  .pace b { color: var(--ink); font-weight: 600; }

  /* sections */
  section { margin-top: 10px; border: 1px solid var(--line); background: var(--panel); }
  section > h2 { margin: 0; padding: 7px 14px; font: inherit; font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--mute); border-bottom: 1px solid var(--line);
    display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
  section > h2 span { letter-spacing: .04em; text-transform: none; }

  /* accounts */
  .acct-head, .acct { display: grid; gap: 0 18px; padding: 0 14px;
    grid-template-columns: 132px minmax(150px, 1fr) minmax(150px, 1fr) minmax(140px, .9fr) 112px minmax(170px, 250px) 150px; }
  .acct-head { padding-top: 6px; padding-bottom: 2px; }
  .acct { padding-top: 9px; padding-bottom: 10px; border-top: 1px solid var(--line); align-items: start; }
  .acct-name { border-left: 3px solid var(--acct); padding-left: 9px; }
  .acct-name b { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; display: block; }
  .big { font-size: 17px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .meter { height: 4px; background: var(--line); border-radius: 2px; margin: 4px 0 4px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 2px; background: var(--acct); }
  .meter.warn i { background: var(--warn); } .meter.crit i { background: var(--crit); }
  .meter.stale i { opacity: .35; }
  .small { font-size: 10px; color: var(--mute); }
  .small b { color: var(--ink-2); font-weight: 500; }
  .mini { margin-bottom: 7px; }
  .span3 { grid-column: span 3; color: var(--ink-2); }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 38px; border-bottom: 1px solid var(--line-2); }
  .bars i { flex: 1; min-width: 2px; background: var(--acct); border-radius: 2px 2px 0 0; opacity: .72; }
  .bars i.zero { height: 1px !important; background: var(--line-2); opacity: 1; border-radius: 0; }
  .bars i.today { opacity: 1; }
  .bars i:hover { opacity: 1; filter: brightness(1.25); }
  .axis { display: flex; justify-content: space-between; font-size: 9px; color: var(--mute); margin-top: 2px; }

  /* models row */
  .chips { display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 8px 14px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

  /* sessions */
  .sessions { display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 0 26px; padding: 6px 14px 8px; }
  .sess { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 60px 50px 44px 30px; gap: 8px; align-items: center;
    padding: 4px 0; border-bottom: 1px solid var(--line); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
  .dot.live { background: var(--good); } .dot.recent { background: var(--warn); }
  .sess .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mtag { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
    border-left: 2px solid var(--c); padding-left: 5px; white-space: nowrap; }
  .spark { display: flex; align-items: flex-end; gap: 1px; height: 16px; }
  .spark i { flex: 1; background: var(--c); border-radius: 1px 1px 0 0; min-height: 0; }
  .r { text-align: right; white-space: nowrap; }

  /* connections */
  #graph { padding: 4px 6px 6px; }
  #graph svg { display: block; width: 100%; }
  #graph text { font: 11px var(--mono); fill: var(--ink-2); }
  #graph text.sub { font-size: 9px; fill: var(--mute); }
  #graph .link { fill: none; stroke-linecap: round; opacity: .5; }
  #graph .hit { fill: none; stroke: transparent; stroke-width: 14; }
  #graph g.s:hover .link, #graph g.s.on .link { opacity: 1; }
  #graph g.s:hover text, #graph g.s.on text { fill: var(--ink); }
  #graph.dimmed g.s:not(.on) { opacity: .25; }
  #graph .flow { stroke-dasharray: 6 12; }

  /* footer */
  .foot { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 18px 36px; padding: 10px 14px 12px; }
  .mrow { display: grid; grid-template-columns: 96px 1fr 62px 62px; gap: 10px; align-items: center; padding: 2px 0; }
  .mbar { height: 8px; background: var(--line); border-radius: 0 4px 4px 0; }
  .mbar i { display: block; height: 100%; background: var(--c); border-radius: 0 4px 4px 0; min-width: 2px; }
  .totals { display: flex; flex-wrap: wrap; gap: 10px 30px; justify-content: flex-end; align-items: flex-end; }
  .tot { text-align: right; } .tot .v { font-size: 15px; font-weight: 600; }
  .note { padding: 0 14px 10px; font-size: 10px; color: var(--mute); }

  #tip { position: fixed; z-index: 9; pointer-events: none; display: none; white-space: pre-line;
    background: #151c2e; border: 1px solid var(--line-2); color: var(--ink); padding: 6px 9px; font-size: 11px;
    max-width: 320px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .err { margin-top: 10px; padding: 8px 14px; border: 1px solid var(--crit); color: var(--ink); display: none; }
  .empty { padding: 14px; color: var(--mute); }

  @media (max-width: 1180px) {
    .acct-head { display: none; }
    .acct { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; }
    .acct > div::before { content: attr(data-h); display: block; font-size: 9px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--mute); margin-bottom: 3px; }
    .acct > .acct-name::before { content: none; }
    .acct-name, .span3 { grid-column: 1 / -1; }
    .foot { grid-template-columns: 1fr; } .totals { justify-content: flex-start; } .tot { text-align: left; }
  }
  @media (max-width: 560px) {
    body { padding: 10px 16px 24px; }
    .brand { border-right: 0; flex-basis: 100%; }
    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; flex-basis: 100%; }
    .kpi { min-width: 0; } .kpi .s { overflow: hidden; text-overflow: ellipsis; }
    .hdr-right { align-items: flex-start; }
    .acct { grid-template-columns: 1fr; }
    .sessions { grid-template-columns: 1fr; }
    .sess { grid-template-columns: 10px minmax(0, 1fr) 50px 30px; }
    .sess .mtag, .sess .spark, .sess .tk { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="lbl">Local monitor</span><b>AI USAGE</b></div>
  <div class="kpis" id="kpis"></div>
  <div class="hdr-right">
    <div class="status"><span class="pulse" id="pulse"></span><span id="stamp">connecting</span></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Time range">
        <button data-range="14">14D</button><button data-range="30">30D</button><button data-range="0">ALL</button>
      </div>
      <button class="btn" id="refresh">REFRESH</button>
    </div>
  </div>
</header>
<div class="err" id="err"></div>
<div class="pace" id="pace"></div>

<section>
  <h2>Accounts <span id="acct-note"></span></h2>
  <div class="acct-head lbl">
    <div>Account · plan</div><div>5-hour window</div><div>Weekly window</div><div>Other limits</div>
    <div>Today</div><div id="bars-h">Last 30 days</div><div>Reading</div>
  </div>
  <div id="accounts"></div>
</section>

<section>
  <h2>Models <span>last used</span></h2>
  <div class="chips" id="models"></div>
</section>

<section>
  <h2>Sessions <span id="sess-note"></span></h2>
  <div class="sessions" id="sessions"></div>
</section>

<section>
  <h2>Connections <span>each line is a session feeding a model · thicker means more tokens · moving dashes mean live</span></h2>
  <div id="graph"></div>
</section>

<section>
  <h2>Totals <span id="tot-note"></span></h2>
  <div class="foot"><div id="bymodel"></div><div class="totals" id="totals"></div></div>
  <div class="note" id="note"></div>
</section>
<div id="tip"></div>

<script>
const S = { data: null, range: 30, ok: false };
try { const r = localStorage.getItem('ai-usage-range'); if (r !== null) S.range = +r; } catch (e) {}

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

function tok(n) {
  if (!n) return '0';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e8 ? 0 : n >= 1e7 ? 1 : 2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'k';
  return String(Math.round(n));
}
function usd(n) {
  if (!n) return '$0';
  if (n >= 1000) return '$' + Math.round(n).toLocaleString('en-US');
  if (n >= 100) return '$' + n.toFixed(0);
  return '$' + n.toFixed(2);
}
function ago(ms) {
  if (!ms) return 'never';
  const s = Math.max(0, (S.data.now - ms) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}
function until(ms) {
  const s = Math.max(0, (ms - S.data.now) / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? d + 'd ' + h + 'h' : h ? h + 'h ' + pad(m) + 'm' : m + 'm';
}
const clock = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const dayTime = ms => new Date(ms).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' + clock(ms);
const shortDay = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString([], { month: 'short', day: 'numeric' }); };
const longDay = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }); };

function family(id) {
  if (id === 'ollama' || id.indexOf('ollama:') === 0) return 'local';
  for (const f of ['fable', 'mythos', 'opus', 'sonnet', 'haiku']) if (id.includes(f)) return f === 'mythos' ? 'fable' : f;
  return 'other';
}
const color = id => 'var(--c-' + family(id) + ')';
function label(id) {
  if (id.indexOf('ollama:') === 0) return id.slice(7);
  const p = id.replace(/^claude-/, '').split('-').filter(x => !/^\d{6,}$/.test(x));
  const name = p.shift() || id;
  return name.charAt(0).toUpperCase() + name.slice(1) + (p.length ? ' ' + p.join('.') : '');
}

function dates() {
  const D = S.data, today = new Date(D.now); today.setHours(12, 0, 0, 0);
  let n = S.range;
  if (!n) {
    const first = Object.keys(D.days).sort()[0];
    if (first) { const [y, m, d] = first.split('-').map(Number); n = Math.round((today - new Date(y, m - 1, d, 12)) / 864e5) + 1; }
    n = Math.min(Math.max(n || 14, 14), 120);
  }
  const out = [];
  for (let i = n - 1; i >= 0; i--) { const x = new Date(today); x.setDate(today.getDate() - i); out.push(dkey(x)); }
  return out;
}
function claudeDay(k) {
  const day = S.data.days[k] || {}, t = { tok: 0, cost: 0, calls: 0, in: 0, out: 0, cw: 0, cr: 0 };
  for (const m in day) if (m !== 'ollama') for (const f in t) t[f] += day[m][f] || 0;
  return t;
}
const ollamaDay = k => (S.data.days[k] || {}).ollama || { calls: 0, fail: 0, secs: 0 };
const rangeLabel = () => S.range ? 'last ' + S.range + ' days' : 'all time';

/* ---------- render ---------- */
function render() {
  const D = S.data; if (!D) return;
  const ds = dates(), todayK = ds[ds.length - 1], start = ds[0];
  const [sy, sm, sd] = start.split('-').map(Number), startMs = new Date(sy, sm - 1, sd).getTime();
  const T = { tok: 0, cost: 0, calls: 0, in: 0, out: 0, cw: 0, cr: 0 }, O = { calls: 0, fail: 0, secs: 0 }, byModel = {};
  for (const k of ds) {
    const c = claudeDay(k); for (const f in T) T[f] += c[f];
    const o = ollamaDay(k); for (const f in O) O[f] += o[f];
    const day = D.days[k] || {};
    for (const m in day) if (m !== 'ollama') { const b = byModel[m] || (byModel[m] = { tok: 0, cost: 0, calls: 0 }); b.tok += day[m].tok; b.cost += day[m].cost; b.calls += day[m].calls; }
  }
  const today = claudeDay(todayK), sess = D.sessions.filter(s => s.end >= startMs), live = D.sessions.filter(s => s.live);
  const claude = D.accounts.find(a => a.id === 'claude'), L = claude.limits;

  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.range === S.range)));
  $('bars-h').textContent = S.range ? 'Last ' + S.range + ' days' : 'All time, by day';

  /* KPIs */
  const kpi = (l, v, s) => '<div class="kpi"><span class="lbl">' + l + '</span><span class="v num">' + v + '</span><span class="s">' + s + '</span></div>';
  $('kpis').innerHTML =
    kpi('Tokens today', tok(today.tok), today.calls + ' calls') +
    kpi('Value today', usd(today.cost), 'at API list price') +
    kpi('Tokens · ' + (S.range ? S.range + 'd' : 'all'), tok(T.tok), T.calls + ' calls') +
    kpi('Value · ' + (S.range ? S.range + 'd' : 'all'), usd(T.cost), L.planPrice ? 'plan costs $' + L.planPrice + '/mo' : 'at API list price') +
    kpi('Sessions', sess.length, rangeLabel()) +
    kpi('Live now', live.length, live.length ? esc(live[0].title.slice(0, 22)) : 'nothing running');

  /* pace */
  let level = 'ok', bits = [];
  const fh = L.fiveHour, wk = L.weekly;
  if (wk.pct != null && wk.state === 'current' && wk.resetsAt) {
    const elapsed = Math.round((1 - (wk.resetsAt - D.now) / 6048e5) * 100);
    if (wk.pct > elapsed + 10) level = 'warn';
    if (wk.pct >= 90) level = 'crit';
    bits.push('Claude weekly at <b>' + wk.pct + '%</b> with <b>' + elapsed + '%</b> of the week gone');
  } else bits.push('No current weekly reading for Claude');
  if (fh.pct != null && fh.state !== 'reset') {
    if (fh.pct >= 80 && level === 'ok') level = 'warn';
    if (fh.pct >= 95) level = 'crit';
    bits.push('5-hour window at <b>' + fh.pct + '%</b>');
  }
  bits.push(D.burn.tok ? 'burning <b>' + tok(D.burn.tok) + '</b> tokens/h (<b>' + usd(D.burn.cost) + '/h</b> at list price)' : 'idle for the last hour');
  if (D.burn.topSession) bits.push('top: <b>' + esc(D.burn.topSession) + '</b>');
  $('pace').innerHTML = '<span class="lbl">Pace</span><span class="tag ' + level + '">' + (level === 'ok' ? '✓ OK' : level === 'warn' ? '▲ WARN' : '■ HIGH') + '</span><span>' + bits.join(' · ') + '</span>';

  /* accounts */
  $('acct-note').textContent = D.sources.transcripts + ' transcripts · ' + D.sources.claudeCalls + ' Claude calls · ' + D.sources.ollamaCalls + ' Ollama calls on this PC';
  $('accounts').innerHTML = D.accounts.map(a => a.id === 'claude' ? claudeRow(a, ds, today) : ollamaRow(a, ds)).join('');

  /* models */
  const chips = D.models.map(m => '<span class="chip" style="--c:' + color(m.id) + '"><i class="sw"></i><span class="dim">Claude</span><b>' + esc(label(m.id)) + '</b><span class="dim">' + ago(m.lastUsed) + (m.priced ? '' : ' · no list price') + '</span></span>');
  const ol = D.accounts.find(a => a.id === 'ollama');
  if (ol) (ol.installed.length ? ol.installed : ['no models installed']).forEach(n => chips.push('<span class="chip" style="--c:var(--c-local)"><i class="sw"></i><span class="dim">Ollama</span><b>' + esc(n) + '</b><span class="dim">installed</span></span>'));
  $('models').innerHTML = chips.join('') || '<span class="dim">No models seen yet</span>';

  /* sessions */
  $('sess-note').textContent = sess.length + ' in ' + rangeLabel() + ' · value at API list price';
  $('sessions').innerHTML = sess.slice(0, 18).map(sessRow).join('') || '<div class="empty">No sessions in this range.</div>';

  drawGraph(sess.slice(0, 16), ol);

  /* totals */
  const ids = Object.keys(byModel).sort((a, b) => byModel[b].tok - byModel[a].tok), max = Math.max(1, ...ids.map(i => byModel[i].tok));
  $('bymodel').innerHTML = (ids.length ? '<div class="mrow lbl"><span>Model</span><span>Tokens</span><span class="r">Tokens</span><span class="r">Value</span></div>' : '') +
    ids.map(i => '<div class="mrow" style="--c:' + color(i) + '" data-tip="' + esc(label(i) + '\n' + tok(byModel[i].tok) + ' tokens · ' + byModel[i].calls + ' calls\n' + usd(byModel[i].cost) + ' at list price') + '"><span>' + esc(label(i)) + '</span><span class="mbar"><i style="width:' + (byModel[i].tok / max * 100).toFixed(1) + '%"></i></span><span class="r num">' + tok(byModel[i].tok) + '</span><span class="r num ink2">' + usd(byModel[i].cost) + '</span></div>').join('') || '<div class="dim">No Claude usage in this range.</div>';
  const tot = (l, v, tip) => '<div class="tot"' + (tip ? ' data-tip="' + esc(tip) + '"' : '') + '><div class="v num">' + v + '</div><div class="lbl">' + l + '</div></div>';
  const active = sess.reduce((n, s) => n + s.activeMin, 0), side = sess.reduce((n, s) => n + s.sideCalls, 0);
  $('totals').innerHTML =
    tot('Calls', T.calls + O.calls, T.calls + ' Claude · ' + O.calls + ' Ollama') +
    tot('Tokens', tok(T.tok), 'input ' + tok(T.in) + '\noutput ' + tok(T.out) + '\ncache write ' + tok(T.cw) + '\ncache read ' + tok(T.cr)) +
    tot('Cache read', (T.tok ? Math.round(T.cr / T.tok * 100) : 0) + '%', 'Share of tokens served from the prompt cache, billed at a fraction of the input price') +
    tot('Output', tok(T.out)) +
    tot('Active min', Math.round(active), 'Minutes with calls less than 5 minutes apart') +
    tot('Subagent calls', side) +
    tot('Failed', O.fail, 'Ollama requests that did not return 2xx') +
    tot('Value at list', usd(T.cost), 'What these Claude tokens would cost on the metered API');
  $('tot-note').textContent = rangeLabel();
  $('note').textContent = 'Values are estimates at published API list prices, not charges: a subscription plan is a flat fee. Token counts cover Claude Code and desktop sessions on this PC only, so usage in the claude.ai chat or on other devices counts toward plan limits without appearing here. Ollama logs record calls, not tokens.';
}

function meter(w, extra) {
  if (w.pct == null) return '<div class="big dim">—</div><div class="small">no reading yet</div>';
  const stale = w.state === 'reset', cls = stale ? 'stale' : w.pct >= 85 ? 'crit' : w.pct >= 60 ? 'warn' : '';
  const flag = stale ? '' : w.pct >= 85 ? ' <span class="small" style="color:var(--ink)">■ high</span>' : w.pct >= 60 ? ' <span class="small" style="color:var(--ink)">▲ warn</span>' : '';
  let right = '', sub = '';
  if (stale) { right = 'window has reset'; sub = 'was ' + w.pct + '% at ' + dayTime(w.readAt); }
  else {
    right = w.resetsAt ? 'resets ' + until(w.resetsAt) + ' · ' + (w.resetsAt - S.data.now > 864e5 ? dayTime(w.resetsAt) : clock(w.resetsAt)) : 'last known';
    if (w.since && w.since.tok) sub = '+' + tok(w.since.tok) + ' tokens here since the reading';
  }
  return '<div class="row"><span class="big num' + (stale ? ' dim' : '') + '">' + (stale ? '—' : w.pct + '%') + flag + '</span><span class="small">' + right + '</span></div>' +
    '<div class="meter ' + cls + '"><i style="width:' + Math.min(100, w.pct) + '%"></i></div>' +
    '<div class="small">' + [sub, extra].filter(Boolean).join(' · ') + '</div>';
}
function dayBars(ds, get, tipOf) {
  const vals = ds.map(get), max = Math.max(1, ...vals), last = ds.length - 1;
  return '<div class="bars">' + vals.map((v, i) => '<i class="' + (v ? '' : 'zero') + (i === last ? ' today' : '') + '" style="height:' + (v ? Math.max(6, v / max * 100) : 0).toFixed(1) + '%" data-tip="' + esc(longDay(ds[i]) + '\n' + tipOf(ds[i])) + '"></i>').join('') + '</div>' +
    '<div class="axis"><span>' + shortDay(ds[0]) + '</span><span>today</span></div>';
}
function claudeRow(a, ds, today) {
  const L = a.limits, fh = L.fiveHour, wk = L.weekly;
  const other = L.other.map(o => '<div class="mini"><div class="row"><span class="small"><b>' + esc(o.label) + '</b></span><span class="num">' + (o.state === 'reset' ? '—' : o.pct + '%') + '</span></div><div class="meter ' + (o.state === 'reset' ? 'stale' : o.pct >= 85 ? 'crit' : o.pct >= 60 ? 'warn' : '') + '"><i style="width:' + Math.min(100, o.pct) + '%"></i></div></div>').join('') +
    (L.extraUsage === false ? '<div class="small">extra usage off</div>' : L.extraUsage ? '<div class="small">extra usage on</div>' : '') || '<div class="small">none reported</div>';
  const readAt = Math.max(fh.readAt || 0, wk.readAt || 0);
  return '<div class="acct" style="--acct:var(--c-fable)">' +
    '<div class="acct-name"><b>Claude</b><span class="small">' + esc(L.plan || 'plan unknown') + (L.planPrice ? ' · $' + L.planPrice + '/mo' : '') + '</span></div>' +
    '<div data-h="5-hour window">' + meter(fh, fh.trailing && fh.trailing.tok ? tok(fh.trailing.tok) + ' here in the last 5h' : '') + '</div>' +
    '<div data-h="Weekly window">' + meter(wk, wk.window && wk.window.tok ? tok(wk.window.tok) + ' here this week' : '') + '</div>' +
    '<div data-h="Other limits">' + other + '</div>' +
    '<div data-h="Today"><div class="big num">' + tok(today.tok) + '</div><div class="small">tokens · <b>' + usd(today.cost) + '</b> at list</div></div>' +
    '<div data-h="By day">' + dayBars(ds, k => claudeDay(k).tok, k => { const c = claudeDay(k); return c.calls ? tok(c.tok) + ' tokens · ' + c.calls + ' calls\n' + usd(c.cost) + ' at list price' : 'no usage'; }) + '</div>' +
    '<div data-h="Reading"><div class="small">usage <b>live</b> · last call ' + (a.lastCall ? ago(a.lastCall) : 'never') + '</div>' +
    '<div class="small">limits read <b>' + (readAt ? ago(readAt) : 'never') + '</b>' + (readAt ? ' · ' + clock(readAt) : '') + '</div>' +
    '<div class="small">' + esc(fh.src || wk.src || 'ask Claude to refresh limits') + '</div></div></div>';
}
function ollamaRow(a, ds) {
  const t = ollamaDay(ds[ds.length - 1]);
  return '<div class="acct" style="--acct:var(--c-local)">' +
    '<div class="acct-name"><b>Ollama</b><span class="small">local · free</span></div>' +
    '<div class="span3" data-h="Limits"><b>No plan limits.</b> <span class="dim">Runs on this PC, so this row is traffic only: the server log records calls and durations, not token counts. ' + (a.installed.length ? 'Installed: ' + esc(a.installed.join(', ')) + '.' : '') + '</span></div>' +
    '<div data-h="Today"><div class="big num">' + t.calls + '</div><div class="small">calls today' + (t.fail ? ' · ' + t.fail + ' failed' : '') + '</div></div>' +
    '<div data-h="By day">' + dayBars(ds, k => ollamaDay(k).calls, k => { const o = ollamaDay(k); return o.calls ? o.calls + ' calls · ' + Math.round(o.secs) + 's generating' + (o.fail ? '\n' + o.fail + ' failed' : '') : 'no calls'; }) + '</div>' +
    '<div data-h="Reading"><div class="small">last call <b>' + (a.lastCall ? ago(a.lastCall) : 'never') + '</b></div><div class="small">' + (a.lastCall ? dayTime(a.lastCall) : '') + '</div><div class="small">server log</div></div></div>';
}
function topModel(s) { return Object.keys(s.models).sort((a, b) => s.models[b].tok - s.models[a].tok)[0]; }
function sessRow(s) {
  const m = topModel(s), n = Object.keys(s.models).length, max = Math.max(1, ...s.spark);
  const state = s.live ? 'live' : S.data.now - s.end < 36e5 ? 'recent' : '';
  const tip = s.title + '\n' + dayTime(s.start) + ' to ' + clock(s.end) + '\n' + tok(s.tok) + ' tokens · ' + s.calls + ' calls · ' + Math.round(s.activeMin) + ' active min\n' +
    Object.keys(s.models).map(k => label(k) + ': ' + tok(s.models[k].tok) + ' · ' + usd(s.models[k].cost)).join('\n') + (s.sideCalls ? '\n' + s.sideCalls + ' subagent calls' : '');
  return '<div class="sess" style="--c:' + color(m) + '" data-tip="' + esc(tip) + '" data-sid="' + esc(s.id) + '">' +
    '<i class="dot ' + state + '" title="' + (state || 'idle') + '"></i><span class="t">' + esc(s.title) + '</span>' +
    '<span class="mtag">' + esc(label(m)) + (n > 1 ? ' +' + (n - 1) : '') + '</span>' +
    '<span class="spark">' + s.spark.map(v => '<i style="height:' + (v ? Math.max(8, v / max * 100) : 0).toFixed(0) + '%"></i>').join('') + '</span>' +
    '<span class="r num">' + usd(s.cost) + '</span><span class="r num ink2 tk">' + tok(s.tok) + '</span><span class="r dim">' + ago(s.end).replace(' ago', '').replace('just now', 'now') + '</span></div>';
}

/* ---------- connections graph ---------- */
function drawGraph(sess, ol) {
  const box = $('graph'), W = Math.max(300, box.clientWidth - 12), narrow = W < 640;
  const totals = {};
  sess.forEach(s => { for (const m in s.models) totals[m] = (totals[m] || 0) + s.models[m].tok; });
  const nodes = Object.keys(totals).sort((a, b) => totals[b] - totals[a]).map(id => ({ id, name: label(id), sub: tok(totals[id]) + ' tokens', faint: false }));
  if (ol) (ol.installed.length ? ol.installed : ['ollama']).slice(0, 4).forEach(n => nodes.push({ id: 'ollama:' + n, name: n, sub: 'local · calls only', faint: true }));
  if (!sess.length) { box.innerHTML = '<div class="empty">No sessions in this range.</div>'; return; }
  const rowH = 24, top = 18, H = Math.max(top * 2 + sess.length * rowH, top * 2 + nodes.length * 58);
  const labelW = narrow ? Math.min(170, W * .45) : 300, chars = Math.floor((labelW - 30) / 6.7);
  const x0 = labelW + 6, x1 = W - (narrow ? 96 : 160), nameMax = narrow ? 10 : 19;
  const ny = {}; nodes.forEach((n, i) => { n.y = top + (H - top * 2) * (i + .5) / nodes.length; ny[n.id] = n.y; });
  const maxTok = Math.max(1, ...sess.map(s => Math.max(...Object.values(s.models).map(m => m.tok))));
  let out = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="Sessions connected to the models they used">';
  sess.forEach((s, i) => {
    const y = top + (H - top * 2) * (i + .5) / sess.length, name = s.title.length > chars ? s.title.slice(0, chars - 1) + '…' : s.title;
    const tip = s.title + '\n' + Object.keys(s.models).map(k => label(k) + ': ' + tok(s.models[k].tok) + ' · ' + usd(s.models[k].cost)).join('\n') + '\n' + ago(s.end) + (s.sideCalls ? ' · ' + s.sideCalls + ' subagent calls' : '');
    out += '<g class="s" data-sid="' + esc(s.id) + '" data-tip="' + esc(tip) + '">';
    for (const m in s.models) {
      const w = 1 + 5 * Math.sqrt(s.models[m].tok / maxTok), mx = (x0 + x1) / 2;
      const d = 'M' + x0 + ' ' + y.toFixed(1) + ' C' + mx + ' ' + y.toFixed(1) + ' ' + mx + ' ' + ny[m].toFixed(1) + ' ' + x1 + ' ' + ny[m].toFixed(1);
      out += '<path class="link" d="' + d + '" stroke="' + color(m) + '" stroke-width="' + w.toFixed(1) + '"/>' +
        (s.live ? '<path class="link flow" d="' + d + '" stroke="#e8ecf4" stroke-width="1.2" style="opacity:.9"/>' : '') + '<path class="hit" d="' + d + '"/>';
    }
    out += '<circle cx="12" cy="' + y.toFixed(1) + '" r="3.5" fill="' + (s.live ? 'var(--good)' : S.data.now - s.end < 36e5 ? 'var(--warn)' : 'var(--line-2)') + '"/>' +
      '<text x="24" y="' + (y + 4).toFixed(1) + '">' + esc(name) + '</text></g>';
  });
  nodes.forEach(n => {
    out += '<g' + (n.faint ? ' opacity=".55"' : '') + '><circle cx="' + (x1 + 9) + '" cy="' + n.y.toFixed(1) + '" r="6" fill="var(--bg)" stroke="' + color(n.id) + '" stroke-width="2"/>' +
      '<text x="' + (x1 + 22) + '" y="' + (n.y - 1).toFixed(1) + '" style="fill:var(--ink)">' + esc(n.name.length > nameMax ? n.name.slice(0, nameMax - 1) + '…' : n.name) + '</text>' +
      '<text class="sub" x="' + (x1 + 22) + '" y="' + (n.y + 11).toFixed(1) + '">' + esc(narrow ? n.sub.replace(' tokens', '').replace('local · calls only', 'local') : n.sub) + '</text></g>';
  });
  box.innerHTML = out + '</svg>';
}

/* ---------- interaction ---------- */
const tip = $('tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.style.display = 'none'; return; }
  tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(6, Math.min(e.clientX + 14, innerWidth - r.width - 8)) + 'px';
  tip.style.top = (e.clientY + 16 + r.height > innerHeight ? e.clientY - r.height - 10 : e.clientY + 16) + 'px';
});
document.addEventListener('mouseover', e => {
  const row = e.target.closest && e.target.closest('.sess'), g = $('graph');
  g.querySelectorAll('g.on').forEach(x => x.classList.remove('on'));
  if (row) { const hit = g.querySelector('g.s[data-sid="' + CSS.escape(row.dataset.sid) + '"]'); if (hit) { hit.classList.add('on'); g.classList.add('dimmed'); return; } }
  g.classList.remove('dimmed');
});
document.querySelector('.seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.range = +b.dataset.range; try { localStorage.setItem('ai-usage-range', S.range); } catch (err) {}
  render();
});
$('refresh').addEventListener('click', load);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 120); });

async function load() {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' }), data = await res.json();
    if (data.error) throw new Error(data.error);
    S.data = data; S.ok = true;
    $('err').style.display = 'none'; $('pulse').classList.remove('off');
    $('stamp').textContent = 'LIVE · ' + new Date(data.now).toLocaleTimeString();
    render();
  } catch (err) {
    S.ok = false; $('pulse').classList.add('off'); $('stamp').textContent = 'OFFLINE';
    $('err').style.display = 'block';
    $('err').textContent = 'Cannot read usage data (' + err.message + '). Is server.py still running?';
  }
}
load();
setInterval(load, 10000);
</script>
</body>
